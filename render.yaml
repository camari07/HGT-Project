databases:
  - name: logtracker-db
    plan: free
    databaseName: logtracker_db
    user: logtracker_user

services:

  - type: static
    name: logtracker-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn backend.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logtracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"


  - type: web
    name: logtracker-frontend
    runtime: static
    plan: free
    rootDir: Logtracker
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./build
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: logtracker-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
